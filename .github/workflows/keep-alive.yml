name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, ~8:17 AM Central
  workflow_dispatch:          # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Beech
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aktixmspptbgvccacbby.supabase.co/rest/v1/courses?select=id&limit=1" \
            -H "apikey: sb_publishable_uBPxXRnZ4icJlE9yRDOxgg_i_NrjUVG")
          echo "Beech responded: $code"
          [ "$code" -lt 500 ]

      # To add a new school: copy the "Ping Beech" step above, rename it,
      # add `if: always()` so one school's hiccup doesn't skip the others,
      # and swap in that school's Project URL and publishable key.
